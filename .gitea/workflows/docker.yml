name: Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'

jobs:
  docker:
    runs-on: self-hosted
    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Docker Login (non-interactive)
      - name: Docker Login
        run: |
          printf '%s' "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ secrets.REGISTRY_URL }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      

      # 3️⃣ Build & Tag
      - name: Build Docker Image
        run: |
          IMAGE_NAME="${{ secrets.REGISTRY_URL }}/sumry/backend"
          if [[ "${GITEA_REF}" == refs/tags/* ]]; then
            TAG="${GITEA_REF#refs/tags/}"
          else
            TAG="latest"
          fi
          echo "Building image: $IMAGE_NAME:$TAG"
          docker build -t $IMAGE_NAME:$TAG .

      # 4️⃣ Push
      - name: Push Docker Image
        run: |
          IMAGE_NAME="${{ secrets.REGISTRY_URL }}/sumry/backend"
          if [[ "${GITEA_REF}" == refs/tags/* ]]; then
            TAG="${GITEA_REF#refs/tags/}"
          else
            TAG="latest"
          fi
          echo "Pushing image: $IMAGE_NAME:$TAG"
          docker push $IMAGE_NAME:$TAG
