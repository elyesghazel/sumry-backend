spring.application.name=core
server.port=48090

# === Database ===
# Credentials come from the environment. The defaults are the local compose stack only.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/sumry-dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA ===
# Hibernate updates DB automaticly
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# === Flyway ausschalten ===
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false

# === Security ===
# JWT_SECRET is required in every deployed environment; startup fails without it.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Browser origins allowed to call the API (comma-separated).
sumry.cors.allowed-origins=${SUMRY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

# === Actuator ===
# Only health is exposed; it is the sole publicly reachable actuator route.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# === API Doc ===
# Off by default; switch on per environment when you need the UI.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
