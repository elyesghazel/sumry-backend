spring.application.name=core
server.port=48090

# === Database ===
# Credentials come from the environment. The defaults are the local compose stack only.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/sumry-dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA ===
# Flyway owns the schema; Hibernate only checks that the entities still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# === Flyway ===
# Databases that predate Flyway carry the Hibernate-grown schema captured in V1, so they
# are baselined at 1 and pick up from V2. A fresh database runs V1 like any other.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# === Security ===
# JWT_SECRET is required in every deployed environment; startup fails without it.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Self-registration. This is a single-user instance and the API is internet-facing,
# so registration stays closed unless a deployment explicitly opens it.
sumry.registration.enabled=${SUMRY_REGISTRATION_ENABLED:false}

# Browser origins allowed to call the API (comma-separated).
sumry.cors.allowed-origins=${SUMRY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

# === Actuator ===
# Only health is exposed; it is the sole publicly reachable actuator route.
management.endpoints.web.exposure.include=health
# Mail is optional, so an unconfigured SMTP host must not turn the whole service DOWN.
management.health.mail.enabled=false
management.endpoint.health.show-details=never

# === API Doc ===
# Off by default; switch on per environment when you need the UI.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# === Mail (monthly statement) ===
# Leave the host empty to keep mail off; the statement endpoint then answers 503.
spring.mail.host=${SUMRY_MAIL_HOST:}
spring.mail.port=${SUMRY_MAIL_PORT:587}
spring.mail.username=${SUMRY_MAIL_USER:}
spring.mail.password=${SUMRY_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SUMRY_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SUMRY_MAIL_STARTTLS:true}
sumry.statement.from=${SUMRY_MAIL_FROM:}
# Send last month's statement automatically on the 1st; recipients are the users' own emails.
sumry.statement.scheduled=${SUMRY_STATEMENT_SCHEDULED:false}

# Claude check for statement imports via the host bridge (headless claude -p); off unless both are set.
sumry.ai.bridge-url=${SUMRY_AI_BRIDGE_URL:}
sumry.ai.bridge-token=${SUMRY_AI_BRIDGE_TOKEN:}
