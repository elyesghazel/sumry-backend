services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=sumry-dev'
      - 'POSTGRES_PASSWORD=123'
      - 'POSTGRES_USER=user'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NEU: Der Healthcheck prüft alle 5s, ob die DB antwortet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sumry-dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'

  backend:
    build: .
    container_name: sumry-backend
    ports:
      - '48090:48090'
    # NEU: Warte auf "healthy", nicht nur auf "started"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sumry-dev
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # NEU: Dialect erzwingen
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect

volumes:
  postgres_data:
