services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=sumry-dev'
      - 'POSTGRES_PASSWORD=123'
      - 'POSTGRES_USER=user'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
# my springboot backend
  backend:
    build: .                      # Baut das Dockerfile im selben Ordner
    container_name: sumry-backend # Ein schöner Name für logs
    ports:
      - '8090:8090'               # Erreichbar unter localhost:8090
    depends_on:
      - postgres
      - redis
    environment:
      # Hier überschreiben wir die application.properties für Docker!
      
      # WICHTIG: Hostname ist 'postgres' (Name des Services oben), nicht localhost!
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sumry-dev
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=123
      
      # WICHTIG: Hostname ist 'redis', nicht localhost!
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

# Volumen für Datenbank-Persistenz definieren
volumes:
  postgres_data:
