# Explicit project name: the directory is called "backend", which collides with other stacks.
name: sumry

services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=sumry-dev'
      - 'POSTGRES_PASSWORD=123'
      - 'POSTGRES_USER=user'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sumry-dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:latest'

  backend:
    build: .
    container_name: sumry-backend
    ports:
      - '48090:48090'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sumry-dev
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      # Local development key only — never reuse this anywhere else.
      - JWT_SECRET=REDACTED
      - SPRINGDOC_ENABLED=true
      - SUMRY_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8081,http://localhost:19006

volumes:
  postgres_data:
